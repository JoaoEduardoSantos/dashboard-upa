      /** Último índice em `horas` com pelo menos um atendimento (ordem do plantão, inclusive noturno). */
      function ultimoIndiceComAtendimentoHoras(grupo, horas) {
        const indices = horas
          .map((h, index) =>
            grupo.some((r) => r.dtAt && r.dtAt.getHours() === h) ? index : null,
          )
          .filter((index) => index !== null);
        return indices.length ? Math.max(...indices) : -1;
      }

      function valorAtendimentoHoraMedico(rows, tipo) {
        if (tipo === "pontos") {
          return rows.reduce((s, r) => s + calcularPontos([r]), 0);
        }
        return rows.length;
      }

      function buildChartHourlyPorMedico(
        grupo,
        tipoPlantao,
        tipo = "pacientes",
      ) {
        const horas = horasDoPlantao(tipoPlantao);
        const ultimoIndice = ultimoIndiceComAtendimentoHoras(grupo, horas);
        const medicos = medicosDoGrupo(grupo);
        const datasets = medicos.map((medico, i) => {
          const color = doctorColorByIndex(i);
          return {
            label: medico,
            data: horas.map((h, index) => {
              if (index > ultimoIndice) return null;
              const rows = grupo.filter(
                (r) => r.medico === medico && r.dtAt && r.dtAt.getHours() === h,
              );
              return valorAtendimentoHoraMedico(rows, tipo);
            }),
            ...buildLineDatasetStyle(color),
            spanGaps: false,
            pointRadius: 3,
            pointHoverRadius: 4,
          };
        });
        return {
          labels: horas.map((h) => labelIntervaloHoraPlantao(h)),
          datasets,
        };
      }

      /** Espera: por hora, linha de máximo e mínimo com faixa preenchida (verde / amarelo). */
      function buildChartEsperaMedicaPorHora(grupo, tipoPlantao) {
        const horas = horasDoPlantao(tipoPlantao);
        const labels = horas.map((h) => labelIntervaloHoraPlantao(h));

        function esperaValidaMin(r) {
          if (!r.dtAt || !r.dtAc) return null;
          const min = (r.dtAt - r.dtAc) / 60000;
          if (min > ESPERA_MEDICA_MAX_MINUTOS || min < 0 || Number.isNaN(min))
            return null;
          return min;
        }

        const ultimoIndice = (() => {
          const indices = horas
            .map((h, index) =>
              grupo.some(
                (r) =>
                  (r.classificacao === "VERDE" ||
                    r.classificacao === "AMARELO") &&
                  r.dtAt &&
                  r.dtAc &&
                  r.dtAt.getHours() === h &&
                  esperaValidaMin(r) != null,
              )
                ? index
                : null,
            )
            .filter((i) => i !== null);
          return indices.length ? Math.max(...indices) : -1;
        })();

        function minMaxPorCor(cor) {
          const maxData = [];
          const minData = [];
          const outlierData = [];
          for (let i = 0; i < horas.length; i++) {
            if (i > ultimoIndice) {
              maxData.push(null);
              minData.push(null);
              outlierData.push(null);
              continue;
            }
            const h = horas[i];
            const vals = grupo
              .filter(
                (r) =>
                  r.classificacao === cor &&
                  r.dtAt &&
                  r.dtAc &&
                  r.dtAt.getHours() === h,
              )
              .map(esperaValidaMin)
              .filter((v) => v != null && !Number.isNaN(v));
            if (!vals.length) {
              maxData.push(null);
              minData.push(null);
              outlierData.push(null);
              continue;
            }
            const { normais, outliers } = separarOutliersSuperiores(vals);
            minData.push(vals.length ? round1(Math.min(...vals)) : null);
            maxData.push(normais.length ? round1(Math.max(...normais)) : null);
            outlierData.push(
              outliers.length ? round1(Math.max(...outliers)) : null,
            );
          }
          return { maxData, minData, outlierData };
        }

        const verde = minMaxPorCor("VERDE");
        const amarelo = minMaxPorCor("AMARELO");

        return {
          labels,
          datasets: [
            ...buildEsperaFaixaDatasets(
              "Verde",
              verde.maxData,
              verde.minData,
              ESPERA_CHART_VERDE,
              ESPERA_FILL_VERDE,
            ),
            ...buildEsperaFaixaDatasets(
              "Amarelo",
              amarelo.maxData,
              amarelo.minData,
              ESPERA_CHART_AMARELO,
              ESPERA_FILL_AMARELO,
            ),
            {
              label: "Verde — ponto discrepante",
              data: verde.outlierData,
              borderColor: ESPERA_CHART_VERDE,
              backgroundColor: ESPERA_CHART_VERDE,
              showLine: false,
              pointRadius: 5,
              pointHoverRadius: 7,
              pointStyle: "circle",
              spanGaps: false,
            },
            {
              label: "Amarelo — ponto discrepante",
              data: amarelo.outlierData,
              borderColor: ESPERA_CHART_AMARELO,
              backgroundColor: ESPERA_CHART_AMARELO,
              showLine: false,
              pointRadius: 5,
              pointHoverRadius: 7,
              pointStyle: "circle",
              spanGaps: false,
            },
          ],
        };
      }

      /** Pontos acumulados até cada slot de 10 min do plantão (bar chart race). */
      function minutosDoPlantao(tipoPlantao) {
        const frames = [];

        if (tipoPlantao === "diurno") {
          for (let h = 7; h <= 18; h++) {
            for (let m = 0; m < 60; m += 10) {
              frames.push({
                h,
                m,
                label: `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`,
              });
            }
          }
          return frames;
        }

        const horas = [19, 20, 21, 22, 23, 0, 1, 2, 3, 4, 5, 6];
        for (const h of horas) {
          for (let m = 0; m < 60; m += 10) {
            frames.push({
              h,
              m,
              label: `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`,
            });
          }
        }

        return frames;
      }

      function buildBarRacePontosPorTempo(grupo, tipoPlantao, plantaoMeta) {
        const framesTempo = minutosDoPlantao(tipoPlantao);
        const medicos = medicosDoGrupo(grupo);
        const ordemHorasNot = [19, 20, 21, 22, 23, 0, 1, 2, 3, 4, 5, 6];

        function ordemNoPlantao(dt) {
          if (!dt) return null;
          const h = dt.getHours();
          const m = dt.getMinutes();

          if (tipoPlantao === "diurno") {
            if (h < 7 || h > 18) return null;
            return (h - 7) * 60 + m;
          }

          const idx = ordemHorasNot.indexOf(h);
          if (idx === -1) return null;
          return idx * 60 + m;
        }

        function limiteMinDoFrame(frame) {
          if (tipoPlantao === "diurno") {
            return (frame.h - 7) * 60 + frame.m;
          }
          return ordemHorasNot.indexOf(frame.h) * 60 + frame.m;
        }

        const frames = framesTempo.map((frame) => {
          const limiteMin = limiteMinDoFrame(frame);

          const acumuladoAteFrame = grupo.filter((r) => {
            const ordem = ordemNoPlantao(r.dtAt);
            return ordem !== null && ordem <= limiteMin;
          });

          const rows = medicos
            .map((medico) => ({
              medico,
              pontos: calcularPontos(
                acumuladoAteFrame.filter((r) => r.medico === medico),
              ),
            }))
            .sort(
              (a, b) =>
                b.pontos - a.pontos ||
                String(a.medico).localeCompare(String(b.medico), "pt-BR"),
            );

          return {
            hour: frame.label,
            rows,
          };
        });

        const trimmed = trimRaceFrames(
          frames,
          framesTempo,
          tipoPlantao,
          plantaoMeta,
          {
            ordemHorasNot,
            limiteMinDoFrame,
            ordemNoPlantao,
          },
        );
        const finalFrame = trimmed[trimmed.length - 1];
        const maxFinalPontos = Math.max(
          ...(finalFrame?.rows || []).map((r) => r.pontos || 0),
          1,
        );

        return {
          maxFinalPontos,
          frames: trimmed,
        };
      }

      function trimRaceFrames(
        frames,
        framesTempo,
        tipoPlantao,
        plantaoMeta,
        helpers,
      ) {
        if (!frames.length) return frames;

        let lastIdx = 0;
        for (let i = 0; i < frames.length; i++) {
          const frame = frames[i];
          const hasPoints = frame.rows.some((r) => (r.pontos || 0) > 0);
          if (hasPoints) lastIdx = i;
          if (i > 0) {
            const prev = frames[i - 1];
            const changed = frame.rows.some((r) => {
              const p = prev.rows.find((x) => x.medico === r.medico);
              return (p?.pontos || 0) !== (r.pontos || 0);
            });
            if (changed) lastIdx = i;
          }
        }

        if (plantaoMeta && plantaoEstaEmAndamento(plantaoMeta)) {
          const agora = new Date();
          const slot = new Date(agora);
          slot.setMinutes(Math.floor(agora.getMinutes() / 10) * 10, 0, 0);
          const ordemAtual = helpers.ordemNoPlantao(slot);
          if (ordemAtual != null) {
            let capIdx = 0;
            for (let i = 0; i < framesTempo.length; i++) {
              if (helpers.limiteMinDoFrame(framesTempo[i]) <= ordemAtual) {
                capIdx = i;
              } else {
                break;
              }
            }
            lastIdx = Math.min(lastIdx, capIdx);
          }
        }

        /* Sempre começa no quadro 1 do plantão (todos os médicos, mesmo com 0 pts). */
        return frames.slice(0, lastIdx + 1);
      }

      function barRaceCorPorMedico(grupo) {
        const medicos = medicosDoGrupo(grupo);
        return Object.fromEntries(
          medicos.map((m, i) => [
            m,
            raceBarGradientForColor(doctorColorByIndex(i)),
          ]),
        );

      function buildDashboardPayload(rows) {
        const plantaoMap = new Map();
        const dataAdjPorStr = new Map();

        for (const r of rows) {
          if (!r.dataAdj || !r.plantao) continue;
          const dataStr = fmtDate(r.dataAdj);
          dataAdjPorStr.set(dataStr, r.dataAdj);
          const dk = `${dataStr}|${r.plantao}`;
          if (!plantaoMap.has(dk)) plantaoMap.set(dk, []);
          plantaoMap.get(dk).push(r);
        }

        const plantoes = [];
        for (const [dk, grupo] of plantaoMap) {
          if (!grupo.length) continue;
          const barra = dk.lastIndexOf("|");
          const dataStr = dk.slice(0, barra);
          const plantao = dk.slice(barra + 1);
          const dataAdj = dataAdjPorStr.get(dataStr) || grupo[0].dataAdj;
          if (!dataAdj) continue;
          const dataISO = toISODateLocal(dataAdj);
          const diaSemana = weekdayPt(dataAdj);
          const id = plantaoId(dataISO, plantao);
          const navLabel = `${plantao}, ${diaSemana}, ${dataStr}`;

          const medMap = new Map();
          for (const r of grupo) {
            if (!medMap.has(r.medico)) medMap.set(r.medico, []);
            medMap.get(r.medico).push(r);
          }

          const tableRows = [];
          for (const [medico, dados] of medMap) {
            const c = contarAtendimentos(dados);
            tableRows.push({
              medico,
              geral: c.total,
              ate2: c.ate2,
              ate12: c.ate12,
              maior60: c.maior60,
              maior80: c.maior80,
              am: c.am,
              lv: c.lv,
              pontos: calcularPontos(dados),
            });
          }
          tableRows.sort(
            (a, b) => b.pontos - a.pontos || b.geral - a.geral || b.am - a.am,
          );

          const stats = calcularEstatisticasKpi(grupo);
          const contagens = contarAtendimentos(grupo);
          const detalheEficiencia = calcularIndiceProdutividade(grupo);
          const detalheDificuldade = calcularIndiceDificuldade(contagens, {
            dataISO,
            plantao,
          });

          plantoes.push({
            id,
            navLabel,
            data: dataStr,
            dataISO,
            diaSemana,
            plantao,
            contagens,
            registros: grupo,
            totalPacientes: grupo.length,
            kpis: {
              totalPacientes: grupo.length,
              tempoMedioEspera: stats.tempoMedioEspera,
              risco: stats.porCor,
              indiceProdutividade: detalheEficiencia.total,
              indiceDificuldade: detalheDificuldade.total,
              indicesDetalhe: {
                eficiencia: detalheEficiencia,
                dificuldade: detalheDificuldade,
              },
            },
            rows: tableRows,
            raceFixedOrder: tableRows.slice(0, RACE_TOP_N).map((r) => r.medico),
            chartHourly: buildChartHourlyPorMedico(grupo, plantao, "pacientes"),
            chartHourlyPontos: buildChartHourlyPorMedico(
              grupo,
              plantao,
              "pontos",
            ),
            chartEsperaPorHora: buildChartEsperaMedicaPorHora(grupo, plantao),
            barRacePontos: buildBarRacePontosPorTempo(grupo, plantao, {
              dataISO,
              plantao,
            }),
            barRaceCorPorMedico: barRaceCorPorMedico(grupo),
          });
        }

        plantoes.sort((a, b) => {
          const d = (a.dataISO || "").localeCompare(b.dataISO || "");
          if (d !== 0) return d;
          if (a.plantao === b.plantao) return 0;
          return a.plantao === "diurno" ? -1 : 1;
        });

        return { plantoes };
      }

      function parseHistoricoMesEntry(entry) {
        const match = String(entry.id || "").match(/^([a-z]{3})(\d{2})$/i);
        if (!match) return { ...entry, monthIdx: -1, year: 0 };
        return {
          ...entry,
          monthIdx: HISTORICO_MESES_ABREV.indexOf(match[1].toLowerCase()),
          year: 2000 + Number(match[2]),
        };
      }

      function historicoCompletoPeriodoLabel() {
        if (!HISTORICO_MESES.length) return "";
        const first = parseHistoricoMesEntry(HISTORICO_MESES[0]);
        const last = parseHistoricoMesEntry(
          HISTORICO_MESES[HISTORICO_MESES.length - 1],
        );
        if (first.monthIdx < 0 || last.monthIdx < 0) return "";
        const n = HISTORICO_MESES.length;
        const mesesWord = n === 1 ? "mês" : "meses";
        const fmt = (entry) =>
          `${HISTORICO_MESES_NOME[entry.monthIdx]}/${entry.year}`;
        return `${fmt(first)} - ${fmt(last)}, total de ${n} ${mesesWord}`;
      }

      function historicoMesesPorAno() {
        const byYear = new Map();
        for (const raw of HISTORICO_MESES) {
          const entry = parseHistoricoMesEntry(raw);
          if (entry.monthIdx < 0 || !entry.year) continue;
          if (!byYear.has(entry.year)) {
            byYear.set(entry.year, Array(12).fill(null));
          }
          byYear.get(entry.year)[entry.monthIdx] = entry;
        }
        return [...byYear.entries()].sort((a, b) => a[0] - b[0]);
      }

      function base64ToUint8Array(b64) {
        const bin = atob(b64);
        const len = bin.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function historicoCacheToArrayBuffer(cached) {
        // Cópia explícita: evita ArrayBuffer “shared” com byteOffset errado.
        const bytes = base64ToUint8Array(cached.b64);
        return bytes.slice().buffer;
      }

      function loadHistoricoCacheScript(entry) {
        window.__HISTORICO_XLS__ = window.__HISTORICO_XLS__ || {};
        if (window.__HISTORICO_XLS__[entry.id]?.b64) {
          return Promise.resolve(window.__HISTORICO_XLS__[entry.id]);
        }
        return new Promise((resolve, reject) => {
          const src = HISTORICO_CACHE_DIR + entry.id + ".js";
          const existing = document.querySelector(
            `script[data-historico-cache="${entry.id}"]`,
          );
          if (existing) {
            existing.addEventListener("load", () => {
              const data = window.__HISTORICO_XLS__[entry.id];
              if (data?.b64) resolve(data);
              else
                reject(
                  new Error(`Cache inválido para ${entry.file} (${entry.id}).`),
                );
            });
            existing.addEventListener("error", () =>
              reject(
                new Error(
                  `Falha ao carregar cache de ${entry.file}. Arquivo esperado: ${src}`,
                ),
              ),
            );
            return;
          }
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.dataset.historicoCache = entry.id;
          script.onload = () => {
            const data = window.__HISTORICO_XLS__[entry.id];
            if (data?.b64) resolve(data);
            else
              reject(
                new Error(`Cache inválido para ${entry.file} (${entry.id}).`),
              );
          };
          script.onerror = () =>
            reject(
              new Error(
                `Falha ao carregar ${entry.file}. Verifique se existe ${src}`,
              ),
            );
          document.head.appendChild(script);
        });
      }

      function formatPlantaoTurnoLabel(p) {
        if (p.plantao === "diurno") return "Diurno";

      /** Fora dos Top 10 do Histórico: VITOR YUKIO → dr. VITOR / ACADÊMICO. */
      function isExcludedFromHistoricoTopRankings(medico) {
        if (!medico) return false;
        if (isVitorYukioNinomiya(medico)) return true;
        const n = normalizarNomeMedico(medico)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
        return (
          n === "DR. VITOR" ||
          n === "DR VITOR" ||
          n === "ACADEMICO" ||
          n === "DR. X" ||
          n === "DR X" ||
          n.includes("VITOR YUKIO")
        );
      }

      function buildHistoricoTopAtendimentos(plantoes, limit = HISTORICO_TOP_N) {
        const byMed = new Map();
        for (const p of plantoes || []) {
          const turno = p.plantao === "noturno" ? "noturno" : "diurno";
          for (const r of p.rows || []) {
            const key = r.medico;
            if (isExcludedFromHistoricoTopRankings(key)) continue;
            if (!byMed.has(key)) {
              byMed.set(key, {
                medico: key,
                geral: 0,
                ate2: 0,
                ate12: 0,
                maior60: 0,
                maior80: 0,
                am: 0,
                lv: 0,
                pontos: 0,
                diurnoSum: 0,
                diurnoCount: 0,
                noturnoSum: 0,
                noturnoCount: 0,
              });
            }
            const acc = byMed.get(key);
            const geral = r.geral || 0;
            acc.geral += geral;
            acc.ate2 += r.ate2 || 0;
            acc.ate12 += r.ate12 || 0;
            acc.maior60 += r.maior60 || 0;
            acc.maior80 += r.maior80 || 0;
            acc.am += r.am || 0;
            acc.lv += r.lv || 0;
            acc.pontos += r.pontos || 0;
            // Médias: só plantões com pelo menos 10 pacientes do médico.
            if (geral >= HISTORICO_MEDIA_MIN_PACIENTES) {
              if (turno === "noturno") {
                acc.noturnoSum += geral;
                acc.noturnoCount += 1;
              } else {
                acc.diurnoSum += geral;
                acc.diurnoCount += 1;
              }
            }
          }
        }
        const ranked = [...byMed.values()]
          .map((r) => ({
            medico: r.medico,
            geral: r.geral,
            ate2: r.ate2,
            ate12: r.ate12,
            maior60: r.maior60,
            maior80: r.maior80,
            am: r.am,
            lv: r.lv,
            pontos: roundScore(r.pontos),
            mediaDiurno:
              r.diurnoCount > 0 ? r.diurnoSum / r.diurnoCount : null,
            mediaNoturno:
              r.noturnoCount > 0 ? r.noturnoSum / r.noturnoCount : null,
          }))
          .sort(
            (a, b) =>
              b.pontos - a.pontos || b.geral - a.geral || b.am - a.am,
          );
        return limit == null ? ranked : ranked.slice(0, limit);
      }

      function buildHistoricoTopPlantoesPontos(plantoes) {
        const marks = [];
        for (const p of plantoes || []) {
          for (const r of p.rows || []) {
            if (isExcludedFromHistoricoTopRankings(r.medico)) continue;
            marks.push({
              medico: r.medico,
              plantaoTurno: formatPlantaoTurnoLabel(p),
              plantaoData: formatPlantaoDataLabel(p),
              plantaoDiaSemana: formatPlantaoDiaSemana(p),
              plantaoId: p.id,
              dataISO: p.dataISO || "",
              geral: r.geral || 0,
              ate2: r.ate2 || 0,
              ate12: r.ate12 || 0,
              maior60: r.maior60 || 0,
              maior80: r.maior80 || 0,
              am: r.am || 0,
              lv: r.lv || 0,
              pontos: r.pontos || 0,
            });
          }
        }
        return marks
          .sort(
            (a, b) =>
              b.pontos - a.pontos ||
              b.geral - a.geral ||
              (b.dataISO || "").localeCompare(a.dataISO || ""),
          )
          .slice(0, HISTORICO_TOP_N);
      }

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")

      function formatNumber(value) {
        if (value === null || value === undefined || Number.isNaN(value))
          return "-";
        return new Intl.NumberFormat("pt-BR", {
          maximumFractionDigits: 1,
        }).format(value);
      }

      function formatDecimal(value, fractionDigits = 1) {
        if (value === null || value === undefined || Number.isNaN(value))
          return "-";
        return new Intl.NumberFormat("pt-BR", {
          minimumFractionDigits: fractionDigits,
          maximumFractionDigits: fractionDigits,
        }).format(value);
      }

        if (typeof value === "number") return `${formatNumber(value)}${suffix}`;
        return String(value);
      }

      function plantoesParaExibicao() {

      /** Agrupa plantões por data para a barra em 2 linhas (diurno / noturno). */
      function agruparPlantoesPorData(plantoes) {
        const porData = new Map();
        for (const p of plantoes) {
          const key = p.dataISO || p.data || "";
          if (!porData.has(key)) {
            porData.set(key, {
              dataISO: p.dataISO,
              data: p.data,
              diaSemana: p.diaSemana,
              diurno: null,
              noturno: null,
            });
          }
          const grupo = porData.get(key);
          if (p.plantao === "diurno") grupo.diurno = p;
          else if (p.plantao === "noturno") grupo.noturno = p;
        }
        return [...porData.values()].sort((a, b) =>
          (b.dataISO || "").localeCompare(a.dataISO || ""),
        );
      }

      /** Agrupa os dias (já agrupados por data) em semanas seg→dom, preservando a posição por dia da semana. */
      function agruparPlantoesPorSemana(grupos) {
        const semanas = new Map();
        for (const g of grupos) {
          const idx = WEEKDAYS_PT.indexOf(g.diaSemana);
          if (idx === -1 || !g.dataISO) continue;
          const [y, m, d] = g.dataISO.split("-").map(Number);
          const segunda = new Date(y, m - 1, d);
          segunda.setDate(segunda.getDate() - idx);
          const semanaKey = toISODateLocal(segunda);
          if (!semanas.has(semanaKey))
            semanas.set(semanaKey, new Array(7).fill(null));
          semanas.get(semanaKey)[idx] = g;
        }
        return [...semanas.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([, dias]) => dias);
      }

      function compareValues(a, b, key, dir = "desc") {
        const av = a[key] ?? -Infinity;
        const bv = b[key] ?? -Infinity;
        if (typeof av === "string")
          return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
        return dir === "asc" ? av - bv : bv - av;
      }

      /** Dados para o gráfico de atendimentos/h: absoluto ou acumulado por médico ao longo do plantão. */
      function prepareAtendimentosPorHoraChartData(base) {
        const labels = [...base.labels];
        const datasets = base.datasets.map((ds) => {
          const dadosBase = [...(ds.data || [])];
          if (state.hourlyAtendMode !== "acumulado") {
            return { ...ds, data: dadosBase, spanGaps: false };
          }
          let sum = 0;
          const data = dadosBase.map((v) => {
            if (v == null || Number.isNaN(v)) return null;
            sum += Number(v) || 0;
            return sum;
          });
          return { ...ds, data, spanGaps: false };
        });
        return { labels, datasets };
      }

      const AVATAR_GENERICOS_DIR = "assets/AVATAR-genericos/";
      /** 1 amarelo · 2 azul · 3 vermelho · 4 verde · 5 laranja (cabelo+óculos). */
      const AVATAR_GENERICOS_COUNT = 5;
      /**
       * Ordem de fallback dos genéricos. OneDrive Files On-Demand às vezes deixa
       * PNGs só na nuvem (timeout). Preferir os que costumam estar no disco.
       * No Finder: pasta assets/ → "Manter sempre neste dispositivo".
       */
      const AVATAR_GENERIC_FALLBACK_ORDER = [1, 4, 5, 2, 3];
      const FAVICON_HREF = "assets/favicon.png";

      function assetImgOnError(img) {
        if (!img) return;
        const tries = Number(img.dataset.loadTries || 0);
        const orig =
          img.dataset.srcOrig ||
          String(img.getAttribute("src") || "").split("?")[0];
        img.dataset.srcOrig = orig;
        if (tries < 2) {
          img.dataset.loadTries = String(tries + 1);
          window.setTimeout(() => {
            img.src =
              orig + (orig.includes("?") ? "&" : "?") + "r=" + Date.now();
          }, 280 * (tries + 1));
          return;
        }
        const list = String(img.dataset.fallbacks || "")
          .split("|")
          .map((s) => s.trim())
          .filter(Boolean);
        const used = Number(img.dataset.fbIndex || 0);
        if (used < list.length) {
          img.dataset.fbIndex = String(used + 1);
          img.dataset.loadTries = "0";
          img.dataset.srcOrig = list[used];
          img.src = list[used];
          return;
        }
        img.style.visibility = "hidden";
      }
      window.__assetImgOnError = assetImgOnError;

        probe.onload = () => {
          link.href = FAVICON_HREF + "?ok=" + Date.now();

        probe.onerror = () => {
          n += 1;
          if (n < 6) {
            window.setTimeout(() => {
              probe.src = FAVICON_HREF + "?r=" + n + "&t=" + Date.now();
            }, 400 * n);
          }
        };
        probe.src = FAVICON_HREF;
      }

      const AVATAR_SLUG_POR_NOME = (() => {

      function genericAvatarIndex(medico) {
        let h = 0;
        const s = normalizarNomeMedico(medico);
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return (h % AVATAR_GENERICOS_COUNT) + 1;
      }

      function resolveAvatarSlug(medico) {
        const key = normalizarNomeMedico(medico);
        return AVATAR_SLUG_POR_NOME.get(key) || null;
      }

      /**
       * Ajuste fino da cabeça/avatar por slug (assets/AVATAR-medicos/).
       * scale: 1 = padrão · <1 menor · >1 maior
       * x: positivo → direita · negativo → esquerda (px = valor × AVATAR_OFFSET_UNIT_PX)
       * y: positivo → sobe · negativo → desce
       */
      const AVATAR_OFFSET_UNIT_PX = 4;

      const AVATAR_AJUSTE_POR_SLUG = {
        joao: { scale: 1.05, x: 0, y: 1 },
        andressa: { scale: 1.12, x: 0, y: -1.5 },
        andressagomes: { scale: 1.15, x: 0, y: -2.5 },
        marcella: { scale: 1.05, x: 0, y: 0 },
        pedro: { scale: 1, x: 0, y: 1 },
        yane: { scale: 1.13, x: 0, y: -2 },
        diana: { scale: 1.15, x: 0, y: -2 },
        helena: { scale: 1.17, x: 0, y: -2 },
        giovanna: { scale: 1.12, x: 0, y: -1.5 },

        nathan: { scale: 0.87, x: 0, y: 2.5 },

      const AVATAR_AJUSTE_PADRAO = { scale: 1, x: 0, y: 0 };

      function getAvatarAjuste(medico) {
        const slug = resolveAvatarSlug(medico);
        if (!slug) return AVATAR_AJUSTE_PADRAO;
        const a = AVATAR_AJUSTE_POR_SLUG[slug];
        if (!a) return AVATAR_AJUSTE_PADRAO;
        return {
          scale:
            typeof a.scale === "number" && Number.isFinite(a.scale) && a.scale > 0
              ? a.scale
              : 1,
          x: typeof a.x === "number" && Number.isFinite(a.x) ? a.x : 0,
          y: typeof a.y === "number" && Number.isFinite(a.y) ? a.y : 0,
        };
      }

      function avatarTransformStyle(
        medico,
        origin = "center center",
        { usePosition = true, scaleMul = 1 } = {},
      ) {
        const { scale, x, y } = getAvatarAjuste(medico);
        const px = usePosition ? x : 0;
        const py = usePosition ? y : 0;
        const s =
          typeof scaleMul === "number" && Number.isFinite(scaleMul) && scaleMul > 0
            ? scale * scaleMul
            : scale;
        if (s === 1 && px === 0 && py === 0) return "";
        const tx = px * AVATAR_OFFSET_UNIT_PX;
        const ty = -py * AVATAR_OFFSET_UNIT_PX;
        const parts = [];
        if (tx || ty) parts.push(`translate(${tx}px,${ty}px)`);
        if (s !== 1) parts.push(`scale(${s})`);
        return ` style="transform:${parts.join(" ")};transform-origin:${origin}"`;
      }

      function avatarGenericFallbacks(exceptHref) {
        return AVATAR_GENERIC_FALLBACK_ORDER.map(
          (i) => `${AVATAR_GENERICOS_DIR}${i}.png`,
        ).filter((href) => href !== exceptHref);
      }

      function avatarUrlsForMedico(medico) {
        const generic = `${AVATAR_GENERICOS_DIR}${genericAvatarIndex(medico)}.png`;
        const slug = resolveAvatarSlug(medico);
        if (slug) {
          return {
            primary: `${AVATAR_MEDICOS_DIR}${slug}.png`,
            fallbacks: [generic, ...avatarGenericFallbacks(generic)],
          };
        }
        return {
          primary: generic,
          fallbacks: avatarGenericFallbacks(generic),
        };
      }

      function avatarImgHtml(className, medico, extraAttrs, scaleStyle) {
        const { primary, fallbacks } = avatarUrlsForMedico(medico);
        const src = escHtmlAttr(primary);
        const fb = escHtmlAttr(fallbacks.join("|"));
        const extra = extraAttrs ? ` ${extraAttrs}` : "";
        return `<img class="${className}" src="${src}" data-fallbacks="${fb}" decoding="async"${extra}${scaleStyle} onerror="window.__assetImgOnError(this)" />`;
      }

      function raceAvatarHtml(medico) {
        const alt = `alt="${escHtmlAttr(medico)}"`;
        const scaleStyle = avatarTransformStyle(medico, "center bottom");
        return avatarImgHtml("race-avatar", medico, alt, scaleStyle);
      }

      function tableMedicoCellHtml(medico) {
        const medEsc = escHtmlAttr(medico);
        const scaleStyle = avatarTransformStyle(medico, "center center", {
          usePosition: false,
          scaleMul: 1.12,
        });
        const img = avatarImgHtml("table-avatar", medico, 'alt=""', scaleStyle);
        return `<span class="table-medico">${img}<span class="table-medico-name" title="${medEsc}">${medEsc}</span></span>`;
      }

      function raceBodyHtml() {
        /* Pescoço +10%: braços/pernas um pouco mais abaixo. */
        return `<svg class="race-body" viewBox="0 0 36 79" aria-hidden="true" focusable="false">
          <g class="race-body-arm race-body-arm--back">
            <line x1="18" y1="42" x2="18" y2="54" />
          </g>
          <g class="race-body-leg race-body-leg--back">
            <line x1="18" y1="55" x2="18" y2="77" />
          </g>
          <g class="race-body-torso">
            <line x1="18" y1="0" x2="18" y2="55" />
          </g>
          <g class="race-body-leg race-body-leg--front">
            <line x1="18" y1="55" x2="18" y2="77" />
          </g>
          <g class="race-body-arm race-body-arm--front">
            <line x1="18" y1="42" x2="18" y2="54" />
          </g>
        </svg>`;

      /** ~3 passos/s; ângulos opostos = tesoura clara de corrida. */
      function applyRaceRunnerPose(markerEl, timeMs) {
        if (!markerEl) return;
        const figure = markerEl.querySelector(".race-runner-figure");
        const armBack = markerEl.querySelector(".race-body-arm--back");
        const armFront = markerEl.querySelector(".race-body-arm--front");
        const legBack = markerEl.querySelector(".race-body-leg--back");
        const legFront = markerEl.querySelector(".race-body-leg--front");
        const torso = markerEl.querySelector(".race-body-torso");
        if (!armBack || !armFront || !legBack || !legFront || !torso) return;

        if (timeMs == null) {
          figure?.classList.remove("race-runner-figure--running");
          armBack.style.transform = "rotate(-12deg)";
          armFront.style.transform = "rotate(14deg)";
          legBack.style.transform = "rotate(10deg)";
          legFront.style.transform = "rotate(-8deg)";
          torso.style.transform = "none";
          return;
        }

        figure?.classList.add("race-runner-figure--running");
        const phase = (timeMs / 1000) * Math.PI * 2 * 3.1;
        const swing = Math.sin(phase);
        armBack.style.transform = `rotate(${swing * 55}deg)`;
        armFront.style.transform = `rotate(${-swing * 55}deg)`;
        legBack.style.transform = `rotate(${-swing * 48}deg)`;
        legFront.style.transform = `rotate(${swing * 48}deg)`;
        /* Tronco/pescoço sempre retos no eixo — girar desalinha dos membros. */
        torso.style.transform = "none";
      }

      function stopRaceRunLoop(rowEl) {
        if (!rowEl) return;
        if (rowEl._raceRunRaf != null) {
          cancelAnimationFrame(rowEl._raceRunRaf);
          rowEl._raceRunRaf = null;
        }
        clearTimeout(rowEl._raceRunTimer);
        rowEl._raceRunTimer = null;
      }

      function startRaceRunLoop(rowEl, markerEl, durationMs) {
        stopRaceRunLoop(rowEl);
        const start = performance.now();
        function tick(now) {
          if (now - start >= durationMs) {
            applyRaceRunnerPose(markerEl, null);
            rowEl._raceRunRaf = null;
            return;
          }
          applyRaceRunnerPose(markerEl, now);
          rowEl._raceRunRaf = requestAnimationFrame(tick);
        }
        rowEl._raceRunRaf = requestAnimationFrame(tick);
      }

      function raceMarkerHtml(medico) {
        const medEsc = escHtmlAttr(medico);
        return `<div class="race-marker">
        <div class="race-runner">
          <div class="race-runner-figure">
            <div class="race-confetti" aria-hidden="true"></div>
            <img class="race-crown" src="assets/crown.png" alt="" aria-hidden="true" />
            ${raceAvatarHtml(medico)}
            ${raceBodyHtml()}
          </div>
          <span class="race-label" title="${medEsc}">${medEsc}</span>
        </div>
      </div>`;
      }

      const RACE_CONFETTI_COLORS = [
        "#f43f5e",
        "#f59e0b",
        "#eab308",
        "#22c55e",
        "#06b6d4",
        "#3b82f6",
        "#8b5cf6",
        "#ec4899",
        "#fb923c",
      ];

      function ensureRaceConfetti(marker) {
        const figure =
          marker.querySelector(".race-runner-figure") ||
          marker.querySelector(".race-runner");
        if (!figure) return;
        let layer = figure.querySelector(".race-confetti");
        if (!layer) {
          layer = document.createElement("div");
          layer.className = "race-confetti";
          layer.setAttribute("aria-hidden", "true");
          figure.insertBefore(layer, figure.firstChild);
        }
        if (layer.childElementCount > 0) return;

        for (let i = 0; i < 32; i++) {
          const piece = document.createElement("span");
          const round = Math.random() > 0.55;
          piece.className = `race-confetti-piece${round ? " race-confetti-piece--round" : " race-confetti-piece--rect"}`;
          piece.style.setProperty(
            "--c",
            RACE_CONFETTI_COLORS[i % RACE_CONFETTI_COLORS.length],
          );
          piece.style.setProperty("--x", `${(Math.random() - 0.5) * 160}px`);
          piece.style.setProperty("--fall", `${70 + Math.random() * 90}px`);
          piece.style.setProperty("--r", `${Math.random() * 720 - 360}deg`);
          piece.style.setProperty("--d", `${0.9 + Math.random() * 1.1}s`);
          piece.style.setProperty("--delay", `${Math.random() * 1.1}s`);
          piece.style.setProperty("--w", `${3 + Math.random() * 5}px`);
          piece.style.setProperty(
            "--h",
            round ? `${3 + Math.random() * 5}px` : `${6 + Math.random() * 9}px`,
          );
          layer.appendChild(piece);
        }
      }

      function clearRaceLimbTransforms(markerEl) {
        if (!markerEl) return;
        markerEl
          .querySelectorAll(
            ".race-body-arm--back, .race-body-arm--front, .race-body-leg--back, .race-body-leg--front, .race-body-torso",
          )
          .forEach((el) => {
            el.style.transform = "";
          });
      }

      function syncRaceCelebration(stage, winnerMed, celebrate) {
        if (!stage) return;
        stage.querySelectorAll(".race-row[data-med]").forEach((rowEl) => {
          const marker = rowEl.querySelector(".race-marker");
          if (!marker) return;
          const isWinner =
            celebrate && winnerMed && rowEl.dataset.med === winnerMed;
          marker.classList.toggle("race-marker--celebrate", !!isWinner);
          if (isWinner) {
            ensureRaceConfetti(marker);
            clearRaceLimbTransforms(marker);
            stopRaceRunLoop(rowEl);
            marker
              .querySelector(".race-runner-figure")
              ?.classList.remove("race-runner-figure--running");
          }
        });
      }

      function raceRankBadgeHtml(rank) {
        if (rank === 0)
          return `<span class="race-rank race-rank--gold" aria-label="1º lugar">1</span>`;
        if (rank === 1)
          return `<span class="race-rank race-rank--silver" aria-label="2º lugar">2</span>`;
        if (rank === 2)
          return `<span class="race-rank race-rank--bronze" aria-label="3º lugar">3</span>`;
        return `<span class="race-rank">${rank + 1}</span>`;
      }

      function getRaceFixedOrder(p) {
        if (p.raceFixedOrder?.length) return p.raceFixedOrder;
        return (p.rows || []).slice(0, RACE_TOP_N).map((r) => r.medico);
      }

      function getCurrentRaceLeaderMed(rows, fixedOrder) {
        if (!fixedOrder?.length) return null;
        const pontosByMed = Object.fromEntries(
          (rows || []).map((r) => [r.medico, r.pontos || 0]),
        );
        const sorted = fixedOrder
          .map((medico) => ({
            medico,
            pontos: pontosByMed[medico] || 0,
          }))
          .sort(
            (a, b) =>
              b.pontos - a.pontos ||
              String(a.medico).localeCompare(String(b.medico), "pt-BR"),
          );
        return sorted[0]?.pontos > 0 ? sorted[0].medico : null;
      }

      function findRaceRow(stage, medico) {
        return [...stage.querySelectorAll(".race-row")].find(
          (el) => el.dataset.med === medico,
        );
      }

      function updateRaceRowElement(
        el,
        row,
        fixedRank,
        p,
        maxRace,
        currentLeaderMed,
        live = false,
      ) {
        const pts = row.pontos || 0;
        const widthPct = Math.max(0, Math.min(100, (pts / maxRace) * 100));

        el.dataset.rank = String(fixedRank);

        const rankEl = el.querySelector(".race-rank-slot");
        if (rankEl) {
          rankEl.innerHTML = raceRankBadgeHtml(fixedRank);
        }

        const barEl = el.querySelector(".race-bar");
        const markerEl = el.querySelector(".race-marker");
        const nextWidth = pts > 0 ? `${Math.max(widthPct, 2)}%` : "0%";
        const prevPts =
          el.dataset.racePts != null ? parseFloat(el.dataset.racePts) : pts;
        const moving = Math.abs(pts - prevPts) > 0.02;
        el.dataset.racePts = String(pts);

        if (barEl) {
          barEl.classList.toggle("race-bar--live", live);
          barEl.style.width = nextWidth;
        }

        if (markerEl) {
          markerEl.hidden = false;
          markerEl.classList.toggle("race-marker--start", pts <= 0);
          const celebrating = markerEl.classList.contains(
            "race-marker--celebrate",
          );
          if (celebrating) {
            stopRaceRunLoop(el);
            clearRaceLimbTransforms(markerEl);
          } else if (live) {
            stopRaceRunLoop(el);
            applyRaceRunnerPose(markerEl, moving ? performance.now() : null);
          } else if (moving) {
            startRaceRunLoop(el, markerEl, 680);
          } else if (!el._raceRunRaf) {
            applyRaceRunnerPose(markerEl, null);
          }
          const labelEl = markerEl.querySelector(".race-label");
          if (labelEl) {
            labelEl.textContent = row.medico;
            labelEl.title = row.medico;
          }
          const avatarEl = markerEl.querySelector(".race-avatar");
          if (avatarEl) {
            avatarEl.classList.toggle(
              "race-avatar--leader",
              row.medico === currentLeaderMed && pts > 0,
            );
          }
        }

        const valueEl = el.querySelector(".race-value");
        if (valueEl) {
          valueEl.textContent = formatNumber(Math.round(pts));
        }

        el.dataset.med = row.medico;
        el.setAttribute(
          "aria-label",
          `${row.medico}, ${formatNumber(Math.round(pts))} pontos`,
        );
      }

      function createRaceRowElement(
        row,
        fixedRank,
        p,
        maxRace,
        currentLeaderMed,
      ) {
        const pts = row.pontos || 0;
        const widthPct = Math.max(0, Math.min(100, (pts / maxRace) * 100));
        const el = document.createElement("div");
        el.className = "race-row race-row--entering";
        el.dataset.med = row.medico;
        el.dataset.rank = String(fixedRank);
        el.dataset.racePts = String(pts);
        el.setAttribute("role", "listitem");
        el.innerHTML = `
        <div class="race-rank-slot">${raceRankBadgeHtml(fixedRank)}</div>
        <div class="race-bar-wrap"><div class="race-bar" style="width:${pts > 0 ? Math.max(widthPct, 2) : 0}%">${raceMarkerHtml(row.medico)}</div></div>
        <span class="race-value">${formatNumber(pts)}</span>`;
        const markerEl = el.querySelector(".race-marker");
        if (markerEl) {
          markerEl.hidden = false;
          markerEl.classList.toggle("race-marker--start", pts <= 0);
          applyRaceRunnerPose(markerEl, null);
          const avatarEl = markerEl.querySelector(".race-avatar");
          if (avatarEl) {
            avatarEl.classList.toggle(
              "race-avatar--leader",
              row.medico === currentLeaderMed && pts > 0,
            );
          }
        }
        el.addEventListener(
          "animationend",
          () => el.classList.remove("race-row--entering"),
          { once: true },
        );
        return el;
      }

      function stopRaceTimer(plantaoId, keepSegment = false) {
        const handle = state.raceTimers[plantaoId];
        if (handle != null) {
          cancelAnimationFrame(handle);
          clearInterval(handle);
          delete state.raceTimers[plantaoId];
        }
        if (!keepSegment) delete state.raceSegment[plantaoId];
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function interpolateRaceRows(frameA, frameB, t) {
        const pontosMap = new Map();
        const medicos = new Set([
          ...frameA.rows.map((r) => r.medico),
          ...frameB.rows.map((r) => r.medico),
        ]);
        for (const medico of medicos) {
          const a = frameA.rows.find((r) => r.medico === medico)?.pontos || 0;
          const b = frameB.rows.find((r) => r.medico === medico)?.pontos || 0;
          pontosMap.set(medico, a + (b - a) * t);
        }
        return [...pontosMap.entries()]
          .map(([medico, pontos]) => ({ medico, pontos }))
          .sort(
            (a, b) =>
              b.pontos - a.pontos ||
              String(a.medico).localeCompare(String(b.medico), "pt-BR"),
          );
      }

      function raceRowsChanged(frameA, frameB) {
        const meds = new Set([
          ...frameA.rows.map((r) => r.medico),
          ...frameB.rows.map((r) => r.medico),
        ]);
        for (const medico of meds) {
          const a = frameA.rows.find((r) => r.medico === medico)?.pontos || 0;
          const b = frameB.rows.find((r) => r.medico === medico)?.pontos || 0;
          if (Math.abs(a - b) > 0.001) return true;
        }
        return false;
      }

      function runRaceAnimation(p) {
        const frames = getBarRaceFrames(p);
        if (frames.length <= 1) return;

        function finishOrContinue(toIdx) {
          if (toIdx >= frames.length - 1) {
            stopRaceTimer(p.id);
            state.racePlayingId = null;
            state.raceFrame[p.id] = toIdx;
            renderBarRaceFrame(p, toIdx);
            syncRacePlayButton(p);
            return;
          }
          advanceSegment(toIdx, toIdx + 1, 0);
        }

        function advanceSegment(fromIdx, toIdx, initialElapsed = 0) {
          if (state.racePlayingId !== p.id) return;

          const frameA = frames[fromIdx];
          const frameB = frames[toIdx];

          if (!raceRowsChanged(frameA, frameB)) {
            state.raceFrame[p.id] = toIdx;
            renderBarRaceFrame(p, toIdx);
            finishOrContinue(toIdx);
            return;
          }

          const segmentStart = performance.now() - initialElapsed;

          function tick(now) {
            if (state.racePlayingId !== p.id) return;

            const elapsed = now - segmentStart;
            const rawT = Math.min(1, elapsed / RACE_SEGMENT_MS);
            const t = easeOutCubic(rawT);
            const rows = interpolateRaceRows(frameA, frameB, t);

            renderBarRaceFrame(p, fromIdx, {
              live: rawT < 1,
              rowsOverride: rows,
              hourOverride: rawT >= 1 ? frameB.hour : frameA.hour,
              updateState: false,
              updateScrubber: false,
            });

            if (rawT < 1) {
              state.raceSegment[p.id] = { fromIdx, toIdx, elapsedMs: elapsed };
              state.raceTimers[p.id] = requestAnimationFrame(tick);
              return;
            }

            delete state.raceSegment[p.id];
            state.raceFrame[p.id] = toIdx;
            renderBarRaceFrame(p, toIdx);
            finishOrContinue(toIdx);
          }

          state.raceTimers[p.id] = requestAnimationFrame(tick);
        }

        let idx = state.raceFrame[p.id] ?? 0;
        const seg = state.raceSegment[p.id];

        if (
          seg &&
          seg.fromIdx === idx &&
          seg.toIdx === idx + 1 &&
          seg.toIdx < frames.length
        ) {
          advanceSegment(seg.fromIdx, seg.toIdx, seg.elapsedMs || 0);
          return;
        }

        if (idx >= frames.length - 1) {
          idx = 0;
          state.raceFrame[p.id] = 0;
          renderBarRaceFrame(p, 0);
          advanceSegment(0, 1, 0);
          return;
        }

        renderBarRaceFrame(p, idx);
        advanceSegment(idx, idx + 1, 0);
      }

      function stopAllRaceTimers() {
        Object.keys(state.raceTimers).forEach((id) => stopRaceTimer(id));
        state.raceSegment = {};
        state.racePlayingId = null;
        Object.keys(state.laneRaceTimers).forEach((id) =>
          stopLaneRaceTimer(id),
        );
        state.laneRaceSegment = {};
        state.laneRacePlayingId = null;
      }

      /** Compatível com `barRacePontos` como array (legado) ou `{ maxFinalPontos, frames }`. */
      function getBarRaceFrames(p) {
        const race = p?.barRacePontos;
        if (!race) return [];
        return Array.isArray(race) ? race : race.frames || [];
      }

      function getBarRaceMaxPontosFinal(p) {
        const race = p?.barRacePontos;
        if (!race) return 1;
        if (
          !Array.isArray(race) &&
          typeof race.maxFinalPontos === "number" &&
          Number.isFinite(race.maxFinalPontos)
        ) {
          return Math.max(1, race.maxFinalPontos);
        }
        const frames = Array.isArray(race) ? race : race.frames || [];
        const last = frames.at(-1);
        return Math.max(1, ...(last?.rows || []).map((r) => r.pontos || 0));
      }

      function syncRacePlayButton(p) {
        const btn = [
          ...(el.plantaoViews?.querySelectorAll(".race-play:not(.finish-play)") ||
            []),
        ].find((b) => b.dataset.id === p.id);
        if (!btn) return;
        const frames = getBarRaceFrames(p);
        const n = frames.length;
        const playing =
          state.racePlayingId === p.id && !!state.raceTimers[p.id];
        if (playing) {
          btn.innerHTML =
            '<span class="race-play-icon" aria-hidden="true">⏸</span> Pausar';
          btn.disabled = false;
          return;
        }
        btn.disabled = false;
        const fi = state.raceFrame[p.id] ?? 0;
        const atEnd = n > 0 && fi >= n - 1;
        if (atEnd) {
          btn.innerHTML =
            '<span class="race-play-icon" aria-hidden="true">↻</span> Reiniciar';
        } else if (fi > 0) {
          btn.innerHTML =
            '<span class="race-play-icon" aria-hidden="true">▶</span> Continuar';
        } else {
          btn.innerHTML =
            '<span class="race-play-icon" aria-hidden="true">▶</span> Reproduzir';
        }
      }

      function syncAllRacePlayButtons() {
        state.plantoes.forEach((p) => {
          syncRacePlayButton(p);
          syncLaneRacePlayButton(p);
        });
      }

      /**
       * Renderiza um quadro da corrida com ordem fixa (tabela de pontos do plantão).
       * Aceita options: { live, rowsOverride, hourOverride, updateState, updateScrubber }
       */
      function renderBarRaceFrame(p, frameIndex, opts = {}) {
        if (typeof opts === "boolean") {
          opts = {};
        }
        const {
          live = false,
          rowsOverride = null,
          hourOverride = null,
          updateState = true,
          updateScrubber = true,
        } = opts;

        const stage = document.getElementById(`race-stage-${p.id}`);
        const hourEl = document.getElementById(`race-hour-${p.id}`);
        const metaEl = document.getElementById(`race-meta-${p.id}`);
        const scrubber = document.getElementById(`race-scrubber-${p.id}`);
        const frames = getBarRaceFrames(p);
        if (!stage || !hourEl) return;

        if (!frames.length) {
          hourEl.textContent = "—";
          if (metaEl) metaEl.textContent = "Sem dados de tempo";
          if (scrubber) scrubber.hidden = true;
          stage.innerHTML = `<p class="chart-subhint">Não há horários para reproduzir neste plantão.</p>`;
          syncRacePlayButton(p);
          return;
        }

        const idx = Math.max(0, Math.min(frameIndex, frames.length - 1));
        if (updateState) state.raceFrame[p.id] = idx;

        const frame = frames[idx];
        const allRows = rowsOverride || frame.rows;
        const maxRace = getBarRaceMaxPontosFinal(p);
        const renderOrder = getRaceFixedOrder(p);
        const visibleMeds = new Set(renderOrder);
        const currentLeaderMed = getCurrentRaceLeaderMed(allRows, renderOrder);

        stage.querySelector(".chart-subhint")?.remove();

        hourEl.textContent = hourOverride ?? frame.hour;
        if (metaEl) {
          metaEl.textContent = `Quadro ${idx + 1} de ${frames.length} · top ${renderOrder.length} médicos`;
        }
        if (scrubber && updateScrubber) {
          scrubber.hidden = false;
          scrubber.max = String(frames.length - 1);
          scrubber.value = String(idx);
        }

        stage.querySelectorAll(".race-row[data-med]").forEach((el) => {
          if (!visibleMeds.has(el.dataset.med)) {
            el.classList.add("race-row--out");
            setTimeout(() => el.remove(), 280);
          }
        });

        const pontosByMed = Object.fromEntries(
          allRows.map((r) => [r.medico, r.pontos]),
        );

        renderOrder.forEach((medico, fixedRank) => {
          const row = {
            medico,
            pontos: pontosByMed[medico] || 0,
          };
          let rowEl = findRaceRow(stage, row.medico);
          if (!rowEl) {
            rowEl = createRaceRowElement(
              row,
              fixedRank,
              p,
              maxRace,
              currentLeaderMed,
            );
            stage.appendChild(rowEl);
          } else {
            updateRaceRowElement(
              rowEl,
              row,
              fixedRank,
              p,
              maxRace,
              currentLeaderMed,
              live,
            );
          }
        });

        const ordered = renderOrder
          .map((med) => findRaceRow(stage, med))
          .filter(Boolean);
        ordered.forEach((el) => stage.appendChild(el));

        let othersEl = stage.querySelector(".race-others");
        const rest = (p.rows || []).slice(RACE_TOP_N);
        if (rest.length) {
          const restPts = rest.reduce((acc, r) => acc + (r.pontos || 0), 0);
          const othersText = `+ ${rest.length} médico(s) fora do top ${RACE_TOP_N} · ${formatNumber(restPts)} pts acumulados`;
          if (!othersEl) {
            othersEl = document.createElement("p");
            othersEl.className = "race-others";
            stage.appendChild(othersEl);
          }
          othersEl.textContent = othersText;
        } else if (othersEl) {
          othersEl.remove();
        }

        const celebrate = !live && idx >= frames.length - 1;
        syncRaceCelebration(stage, currentLeaderMed, celebrate);

        syncRacePlayButton(p);
      }

      function playBarRace(p) {
        const frames = getBarRaceFrames(p);
        if (!frames.length) return;

        if (state.racePlayingId === p.id && state.raceTimers[p.id]) {
          stopRaceTimer(p.id, true);
          state.racePlayingId = null;
          syncRacePlayButton(p);
          return;
        }

        stopRaceTimer(p.id, !!state.raceSegment[p.id]);
        state.racePlayingId = p.id;

        let idx = state.raceFrame[p.id] ?? 0;
        if (idx >= frames.length - 1 && !state.raceSegment[p.id]) {
          idx = 0;
          state.raceFrame[p.id] = 0;
          delete state.raceSegment[p.id];
        }

        syncRacePlayButton(p);

        if (frames.length <= 1) {
          renderBarRaceFrame(p, idx);
          state.racePlayingId = null;
          return;
        }

        runRaceAnimation(p);
      }

      function scrubBarRace(p, frameIndex) {
        stopRaceTimer(p.id);
        delete state.raceSegment[p.id];
        if (state.racePlayingId === p.id) state.racePlayingId = null;
        renderBarRaceFrame(p, frameIndex);
        syncRacePlayButton(p);
      }

      function wirePlantaoMainDelegatesOnce() {
        if (plantaoMainDelegatesWired) return;
        plantaoMainDelegatesWired = true;
        el.plantaoMain.addEventListener("click", (e) => {
          const collapseToggle = e.target.closest(".race-collapse-toggle");
          if (collapseToggle) {
            const card = collapseToggle.closest(".race-card");
            if (!card) return;
            const collapsed = card.classList.toggle("race-card--collapsed");
            collapseToggle.setAttribute(
              "aria-expanded",
              collapsed ? "false" : "true",
            );
            if (collapsed) {
              const pid = card.dataset.id;
              if (pid && state.racePlayingId === pid) {
                stopRaceTimer(pid, true);
                state.racePlayingId = null;
                const pMatch = state.plantoes.find((x) => x.id === pid);
                if (pMatch) syncRacePlayButton(pMatch);
              }
            }
            return;
          }

          const finishBtn = e.target.closest(".finish-play");
          if (finishBtn) {
            const pid = finishBtn.dataset.id;
            const pMatch = state.plantoes.find((x) => x.id === pid);
            if (pMatch) playLaneRace(pMatch);
            return;
          }

          const raceBtn = e.target.closest(".race-play");
          if (raceBtn) {
            const pid = raceBtn.dataset.id;
            const pMatch = state.plantoes.find((x) => x.id === pid);
            if (pMatch) playBarRace(pMatch);
            return;
          }

          const tipoBtn = e.target.closest(".hourly-atend-tipo");
          if (tipoBtn) {
            const tipo = tipoBtn.dataset.tipo;
            if (!tipo || tipo === state.hourlyAtendTipo) return;
            state.hourlyAtendTipo = tipo;
            syncHourlyAtendTipoButtons();
            const pTipo = state.plantoes.find((x) => x.id === state.selectedId);
            if (pTipo) renderPlantaoChart(pTipo);
            return;
          }

          const btn = e.target.closest(".hourly-atend-mode");
          if (!btn) return;
          const mode = btn.dataset.mode;
          if (!mode || mode === state.hourlyAtendMode) return;
          state.hourlyAtendMode = mode;
          syncHourlyAtendModeButtons();
          syncHourlyAtendTipoButtons();
          const p = state.plantoes.find((x) => x.id === state.selectedId);
          if (p) renderPlantaoChart(p);
        });

        el.plantaoMain.addEventListener("input", (e) => {
          const scrubber = e.target.closest(".race-scrubber");
          if (!scrubber) return;
          const pid = scrubber.dataset.id;
          const pMatch = state.plantoes.find((x) => x.id === pid);
          if (pMatch) scrubBarRace(pMatch, Number(scrubber.value));
        });
      }

          if (!marker) return;

          marker.classList.toggle("race-marker--celebrate", !!isWinner);
          wrap.classList.toggle("finish-marker--champ", !!isWinner);
          if (isWinner) {
            ensureRaceConfetti(marker);

              .querySelector(".race-runner-figure")
              ?.classList.remove("race-runner-figure--running");

        const wrap = document.createElement("div");
        wrap.className = "finish-marker";
        wrap.dataset.med = medico;
        const medEsc = escHtmlAttr(medico);
        wrap.innerHTML = `${raceMarkerHtml(medico)}
          <div class="finish-caption">
            <span class="finish-label" title="${medEsc}">${medEsc}</span>
            <span class="finish-pts">0 pts</span>
          </div>`;
        const marker = wrap.querySelector(".race-marker");
        if (marker) applyRaceRunnerPose(marker, null);
        return wrap;
      }

      function updateLaneMarker(
        wrap,
        medico,
        pts,
        maxRace,
        leaderMed,
        live,
      ) {
        const pct = Math.max(
          0,
          Math.min(100, (pts / Math.max(1, maxRace)) * 100),
        );
        const prevPts =
          wrap.dataset.racePts != null
            ? parseFloat(wrap.dataset.racePts)
            : pts;
        const moving = Math.abs(pts - prevPts) > 0.02;
        wrap.dataset.racePts = String(pts);
        wrap.style.left = `${pct}%`;
        wrap.style.zIndex = String(10 + Math.round(pct));
        wrap.classList.toggle(
          "finish-marker--champ",
          medico === leaderMed && pts > 0,
        );
        wrap.setAttribute(
          "aria-label",
          `${medico}, ${formatNumber(Math.round(pts))} pontos`,
        );

        const ptsEl = wrap.querySelector(".finish-pts");
        if (ptsEl) ptsEl.textContent = `${formatNumber(Math.round(pts))} pts`;

        const marker = wrap.querySelector(".race-marker");
        if (!marker) return;
        marker.classList.toggle("race-marker--start", pts <= 0);
        const celebrating = marker.classList.contains("race-marker--celebrate");
        if (celebrating) {
          stopRaceRunLoop(wrap);
          clearRaceLimbTransforms(marker);
        } else if (live) {
          stopRaceRunLoop(wrap);
          applyRaceRunnerPose(marker, moving ? performance.now() : null);
        } else if (moving) {
          startRaceRunLoop(wrap, marker, 680);
        } else if (!wrap._raceRunRaf) {
          applyRaceRunnerPose(marker, null);
        }

        const avatarEl = marker.querySelector(".race-avatar");
        if (avatarEl) {
          avatarEl.classList.toggle(
            "race-avatar--leader",
            medico === leaderMed && pts > 0,
          );
        }
      }

      /**
       * Corrida na linha: mesma escala da corrida de barras (maxFinalPontos).
       * Campeão final fica em 100% (direita).
       */
      function renderLaneRaceFrame(p, frameIndex, opts = {}) {
        const {
          live = false,
          rowsOverride = null,
          hourOverride = null,
          updateState = true,
        } = opts;

        const rail = document.getElementById(`finish-track-${p.id}`);
        const hourEl = document.getElementById(`finish-hour-${p.id}`);
        const metaEl = document.getElementById(`finish-meta-${p.id}`);
        const frames = getBarRaceFrames(p);
        if (!rail) return;

        rail
          .querySelectorAll(".finish-line-empty")
          .forEach((node) => node.remove());

        if (!frames.length) {
          if (hourEl) hourEl.textContent = "—";
          if (metaEl) metaEl.textContent = "";
          rail.querySelectorAll(".finish-marker").forEach((n) => n.remove());
          const empty = document.createElement("p");
          empty.className = "chart-subhint finish-line-empty";
          empty.textContent = "Não há horários para reproduzir neste plantão.";
          empty.style.position = "absolute";
          empty.style.inset = "0";
          empty.style.display = "grid";
          empty.style.placeItems = "center";
          rail.appendChild(empty);
          syncLaneRacePlayButton(p);
          return;
        }

        const idx = Math.max(0, Math.min(frameIndex, frames.length - 1));
        if (updateState) state.laneRaceFrame[p.id] = idx;

        const frame = frames[idx];
        const allRows = rowsOverride || frame.rows;
        const maxRace = getBarRaceMaxPontosFinal(p);
        const renderOrder = getRaceFixedOrder(p);
        const visibleMeds = new Set(renderOrder);
        const currentLeaderMed = getCurrentRaceLeaderMed(allRows, renderOrder);
        const pontosByMed = Object.fromEntries(
          allRows.map((r) => [r.medico, r.pontos || 0]),
        );

        if (hourEl) hourEl.textContent = hourOverride ?? frame.hour ?? "—";
        if (metaEl) {
          metaEl.textContent = `· Quadro ${idx + 1} de ${frames.length}`;
        }

        rail.querySelectorAll(".finish-marker[data-med]").forEach((el) => {
          if (!visibleMeds.has(el.dataset.med)) el.remove();
        });

        renderOrder.forEach((medico) => {
          const pts = pontosByMed[medico] || 0;
          let wrap = findLaneMarker(rail, medico);
          if (!wrap) {
            wrap = createLaneMarker(medico);
            rail.appendChild(wrap);
          }
          updateLaneMarker(
            wrap,
            medico,
            pts,
            maxRace,
            currentLeaderMed,
            live,
          );
        });

        const celebrate =
          !live &&
          idx >= frames.length - 1 &&
          !!state.laneRaceCelebrate[p.id];
        syncLaneCelebration(rail, currentLeaderMed, celebrate);
        syncLaneRacePlayButton(p);
      }

      /** Idle: posição final. Em reprodução: mantém o quadro atual. */
      function renderFinishLine(p) {
        const frames = getBarRaceFrames(p);
        if (!frames.length) {
          renderLaneRaceFrame(p, 0);
          return;
        }
        if (state.laneRacePlayingId !== p.id) {
          state.laneRaceFrame[p.id] = frames.length - 1;
        }
        renderLaneRaceFrame(
          p,
          state.laneRaceFrame[p.id] ?? frames.length - 1,
        );
      }

      function runLaneRaceAnimation(p) {
        const frames = getBarRaceFrames(p);
        if (frames.length <= 1) return;

        function finishOrContinue(toIdx) {
          if (toIdx >= frames.length - 1) {
            stopLaneRaceTimer(p.id);
            state.laneRacePlayingId = null;
            state.laneRaceFrame[p.id] = toIdx;
            state.laneRaceCelebrate[p.id] = true;
            renderLaneRaceFrame(p, toIdx);
            syncLaneRacePlayButton(p);
            return;
          }
          advanceSegment(toIdx, toIdx + 1, 0);
        }

        function advanceSegment(fromIdx, toIdx, initialElapsed = 0) {
          if (state.laneRacePlayingId !== p.id) return;

          const frameA = frames[fromIdx];
          const frameB = frames[toIdx];

          if (!raceRowsChanged(frameA, frameB)) {
            state.laneRaceFrame[p.id] = toIdx;
            renderLaneRaceFrame(p, toIdx);
            finishOrContinue(toIdx);
            return;
          }

          const segmentStart = performance.now() - initialElapsed;

          function tick(now) {
            if (state.laneRacePlayingId !== p.id) return;

            const elapsed = now - segmentStart;
            const rawT = Math.min(1, elapsed / RACE_SEGMENT_MS);
            const t = easeOutCubic(rawT);
            const rows = interpolateRaceRows(frameA, frameB, t);

            renderLaneRaceFrame(p, fromIdx, {
              live: rawT < 1,
              rowsOverride: rows,
              hourOverride: rawT >= 1 ? frameB.hour : frameA.hour,
              updateState: false,
            });

            if (rawT < 1) {
              state.laneRaceSegment[p.id] = {
                fromIdx,
                toIdx,
                elapsedMs: elapsed,
              };
              state.laneRaceTimers[p.id] = requestAnimationFrame(tick);
              return;
            }

            delete state.laneRaceSegment[p.id];
            state.laneRaceFrame[p.id] = toIdx;
            renderLaneRaceFrame(p, toIdx);
            finishOrContinue(toIdx);
          }

          state.laneRaceTimers[p.id] = requestAnimationFrame(tick);
        }

        let idx = state.laneRaceFrame[p.id] ?? 0;
        const seg = state.laneRaceSegment[p.id];

        if (
          seg &&
          seg.fromIdx === idx &&
          seg.toIdx === idx + 1 &&
          seg.toIdx < frames.length
        ) {
          advanceSegment(seg.fromIdx, seg.toIdx, seg.elapsedMs || 0);
          return;
        }

        if (idx >= frames.length - 1) {
          idx = 0;
          state.laneRaceFrame[p.id] = 0;
          renderLaneRaceFrame(p, 0);
          advanceSegment(0, 1, 0);
          return;
        }

        renderLaneRaceFrame(p, idx);
        advanceSegment(idx, idx + 1, 0);
      }

      function playLaneRace(p) {
        const frames = getBarRaceFrames(p);
        if (!frames.length) return;

        if (state.laneRacePlayingId === p.id && state.laneRaceTimers[p.id]) {
          stopLaneRaceTimer(p.id, true);
          state.laneRacePlayingId = null;
          syncLaneRacePlayButton(p);
          return;
        }

        stopLaneRaceTimer(p.id, !!state.laneRaceSegment[p.id]);
        state.laneRacePlayingId = p.id;

        let idx = state.laneRaceFrame[p.id] ?? frames.length - 1;

        /* Da posição final (ou reinício): todos voltam ao começo. */
        if (idx >= frames.length - 1 && !state.laneRaceSegment[p.id]) {
          idx = 0;
          state.laneRaceFrame[p.id] = 0;
          state.laneRaceCelebrate[p.id] = false;
          delete state.laneRaceSegment[p.id];
          renderLaneRaceFrame(p, 0);
        }

        syncLaneRacePlayButton(p);

        if (frames.length <= 1) {
          renderLaneRaceFrame(p, idx);
          state.laneRacePlayingId = null;
          syncLaneRacePlayButton(p);
          return;
        }

        runLaneRaceAnimation(p);
      }

      function renderPlantaoChart(p) {
        const chartKey = (suffix) => `chart:${p.id}:${suffix}`;

        function destroyChart(suffix) {
          const key = chartKey(suffix);
          if (state.charts[key]) {
            state.charts[key].destroy();
            delete state.charts[key];
          }
        }

        destroyChart("atend");
        destroyChart("espera");

        const canvasAtend = document.getElementById(`chart-${p.id}`);
        if (canvasAtend) {
          const atendData = prepareAtendimentosPorHoraChartData(
            hourlyChartBaseData(p),
          );
          const yTitle = hourlyChartYTitle();
          const atendOpts = chartBaseOptions();
          atendOpts.plugins.tooltip = { enabled: false };
          atendOpts.scales.x.title = {
            ...atendOpts.scales.x.title,
            text: "Horário",
          };
          atendOpts.scales.y.title = {
            ...atendOpts.scales.y.title,
            text: yTitle,
          };
          atendOpts.scales.y.max = atendimentosYScaleMax(atendData.datasets);
          atendOpts.scales.y.ticks = {
            ...atendOpts.scales.y.ticks,
            stepSize: 2,
          };
          atendOpts.animation = { duration: 200 };
          atendOpts.hover = { mode: "nearest", intersect: false, axis: "xy" };
          let atendHoverIndex = null;
          const ATEND_HOVER_MAX_DIST = 24;
          atendOpts.onHover = (event, _elements, chart) => {
            const xScale = chart.scales.x;
            const yScale = chart.scales.y;
            const pos =
              event.type === "mouseout"
                ? null
                : Chart.helpers.getRelativePosition(event, chart);
            const dentroDaArea =
              pos &&
              pos.x >= xScale.left &&
              pos.x <= xScale.right &&
              pos.y >= yScale.top &&
              pos.y <= yScale.bottom;

            let idx = null;
            if (dentroDaArea) {
              let nearestLabelIndex = 0;
              let minXDist = Infinity;
              chart.data.labels.forEach((_, i) => {
                const dist = Math.abs(xScale.getPixelForValue(i) - pos.x);
                if (dist < minXDist) {
                  minXDist = dist;
                  nearestLabelIndex = i;
                }
              });

              let bestIdx = null;
              let bestDist = Infinity;
              chart.data.datasets.forEach((ds, i) => {
                if (!ds._baseColor) return;
                const val = valorNumericoPontoGrafico(
                  ds.data?.[nearestLabelIndex],
                );
                if (val == null) return;
                const dist = Math.abs(yScale.getPixelForValue(val) - pos.y);
                if (dist < bestDist) {
                  bestDist = dist;
                  bestIdx = i;
                }
              });

              if (bestDist <= ATEND_HOVER_MAX_DIST) idx = bestIdx;
            }

            if (idx === atendHoverIndex) return;
            atendHoverIndex = idx;
            applyDatasetHoverHighlight(chart, idx);
          };
          state.charts[chartKey("atend")] = new Chart(canvasAtend, {
            type: "line",
            data: atendData,
            options: atendOpts,
          });
        }

        const canvasEsp = document.getElementById(`chart-espera-${p.id}`);
        if (!canvasEsp) return;

        const esperaOpts = chartBaseOptions();
        const esperaData = p.chartEsperaPorHora || { labels: [], datasets: [] };

        esperaOpts.plugins.legend.labels.filter = (item) =>
          !String(item.text).includes("__min");
        esperaOpts.plugins.tooltip.callbacks = {
          title(items) {
            const idx = items?.[0]?.dataIndex;
            return esperaData.labels?.[idx] ?? "";
          },
          label(ctx) {
            if (String(ctx.dataset.label).includes("__min")) return null;
            const y = valorNumericoPontoGrafico(ctx.raw);
            if (y == null) return null;
            const cor = String(ctx.dataset.label);
            if (cor.includes("ponto discrepante")) {
              return `${cor}: ${formatNumber(y)} min`;
            }
            const idx = ctx.dataIndex;
            const minDs = ctx.chart.data.datasets[ctx.datasetIndex + 1];
            const minVal = minDs?.data?.[idx];
            if (minVal != null && !Number.isNaN(minVal)) {
              return `${cor}: ${formatNumber(minVal)} – ${formatNumber(y)} min`;
            }
            return `${cor} (máx.): ${formatNumber(y)} min`;
          },
        };
        esperaOpts.scales.x.title = {
          ...esperaOpts.scales.x.title,
          text: "Horário (início do atendimento médico)",
        };
        esperaOpts.scales.y.title = {
          ...esperaOpts.scales.y.title,
          text: "Tempo de espera",
        };
        esperaOpts.scales.y.max = esperaYScaleMax(esperaData.datasets);
        esperaOpts.scales.y.ticks = {
          ...esperaOpts.scales.y.ticks,
          stepSize: 20,
          callback: (value) => formatEsperaEixoMinutos(value),
        };

        state.charts[chartKey("espera")] = new Chart(canvasEsp, {
          type: "line",
          data: esperaData,
          options: esperaOpts,
        });
      }

      function selectPlantao(id) {

          view.classList.toggle("active", view.dataset.id === id);

      async function bootstrapWithPayload(payload) {
        stopAllRaceTimers();
        state.raceFrame = {};
        state.raceSegment = {};
        state.laneRaceFrame = {};
        state.laneRaceSegment = {};
        state.laneRaceCelebrate = {};
        state.raw = payload;
        state.plantoes = payload.data.plantoes || [];
        state.selectedId =
          state.plantoes[state.plantoes.length - 1]?.id ?? null;

          setUploadError("Nenhum plantão encontrado na planilha.");

        el.plantaoMain.hidden = false;
