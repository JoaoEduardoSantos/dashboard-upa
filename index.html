      function historicoMesesSignature() {
        return HISTORICO_MESES.map((m) => m.id + ":" + m.file).join("|");
      }

      function historicoIdFromDataISO(iso) {
        const match = String(iso || "").match(/^(\d{4})-(\d{2})/);
        if (!match) return null;
        const monthIdx = Number(match[2]) - 1;
        const abrev = HISTORICO_MESES_ABREV[monthIdx];
        if (!abrev) return null;
        return `${abrev}${match[1].slice(-2)}`;
      }

      function topMedicoAtendimentos(plantoes) {
        return buildHistoricoTopAtendimentos(plantoes)[0]?.medico || null;
      }

      function loadHistoricoTopMedicoCache() {
        try {
          const data = JSON.parse(
            localStorage.getItem(HISTORICO_TOP_MEDICO_KEY) || "null",
          );
          if (!data || data.sig !== historicoMesesSignature() || !data.months) {
            return;
          }
          state.historicoTopMedico = { ...data.months };
          if (data.completo) {
            state.historicoTopMedico[HISTORICO_COMPLETO_ID] = data.completo;
          }
        } catch {
          /* cache inválido */
        }
      }

      function saveHistoricoTopMedicoCache() {
        try {
          const months = {};
          for (const [id, medico] of Object.entries(state.historicoTopMedico)) {
            if (id === HISTORICO_COMPLETO_ID || !medico) continue;
            months[id] = medico;
          }
          localStorage.setItem(
            HISTORICO_TOP_MEDICO_KEY,
            JSON.stringify({
              sig: historicoMesesSignature(),
              months,
              completo: state.historicoTopMedico[HISTORICO_COMPLETO_ID] || null,
            }),
          );
        } catch {
          /* quota / private mode */
        }
      }

      function rememberHistoricoTopFromPlantoes(historicoId, plantoes) {
        const list = plantoes || [];
        if (historicoId === HISTORICO_COMPLETO_ID) {
          const byMonth = new Map();
          for (const p of list) {
            const id = historicoIdFromDataISO(p.dataISO || "");
            if (!id) continue;
            if (!byMonth.has(id)) byMonth.set(id, []);
            byMonth.get(id).push(p);
          }
          for (const [id, monthPlantoes] of byMonth) {
            const top = topMedicoAtendimentos(monthPlantoes);
            if (top) state.historicoTopMedico[id] = top;
          }
        }
        const top = topMedicoAtendimentos(list);
        if (top) state.historicoTopMedico[historicoId] = top;
        saveHistoricoTopMedicoCache();
        patchHistoricoChipAvatars();
      }

      function historicoChipAvatarHtml(medico, className) {
        if (!medico) return "";
        const scaleStyle = avatarTransformStyle(medico, "center center", {
          usePosition: false,
          scaleMul: 1,
        });
        const extra = `alt="${escHtmlAttr(medico)}" title="${escHtmlAttr(medico)}"`;
        return avatarImgHtml(className, medico, extra, scaleStyle);
      }

      function patchHistoricoChipAvatars() {
        el.historicoMonths
          ?.querySelectorAll(".historico-month-btn")
          .forEach((btn) => {
            const id = btn.dataset.historicoId;
            const medico = id ? state.historicoTopMedico[id] : null;
            const isAll = btn.classList.contains("historico-all-chip");
            const cls = isAll
              ? "historico-all-chip-avatar historico-chip-avatar"
              : "historico-month-chip-avatar historico-chip-avatar";
            const html = historicoChipAvatarHtml(medico, cls);
            const existing = btn.querySelector(".historico-chip-avatar");
            if (!html) {
              existing?.remove();
              return;
            }
            if (existing) existing.outerHTML = html;
            else btn.insertAdjacentHTML("beforeend", html);
          });
      }

      async function warmHistoricoTopMedicos() {
        if (historicoTopWarmPromise) return historicoTopWarmPromise;
        historicoTopWarmPromise = (async () => {
          loadHistoricoTopMedicoCache();
          patchHistoricoChipAvatars();
          const missingMonths = HISTORICO_MESES.filter(
            (m) => !state.historicoTopMedico[m.id],
          );
          const needCompleto = !state.historicoTopMedico[HISTORICO_COMPLETO_ID];
          if (!missingMonths.length && !needCompleto) return;
          const completoAcc = new Map();
          const toLoad = needCompleto ? HISTORICO_MESES : missingMonths;
          for (const entry of toLoad) {
            try {
              const { name, buffer } = await fetchHistoricoFile(entry);
              const payload = await processarArrayBuffer(buffer, name);
              const ranked = buildHistoricoTopAtendimentos(
                payload?.data?.plantoes || [],
                null,
              );
              const top = ranked[0]?.medico || null;
              if (top) state.historicoTopMedico[entry.id] = top;
              if (needCompleto) {
                for (const r of ranked) {
                  const prev = completoAcc.get(r.medico) || {
                    geral: 0,
                    pontos: 0,
                    am: 0,
                  };
                  prev.geral += r.geral || 0;
                  prev.pontos += r.pontos || 0;
                  prev.am += r.am || 0;
                  completoAcc.set(r.medico, prev);
                }
              }
              patchHistoricoChipAvatars();
            } catch {
              /* mês sem cache / planilha ilegível */
            }
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
          if (needCompleto && completoAcc.size) {
            const top = [...completoAcc.entries()].sort((a, b) => {
              const da = a[1];
              const db = b[1];
              return (
                db.pontos - da.pontos ||
                db.geral - da.geral ||
                db.am - da.am ||
                String(a[0]).localeCompare(b[0])
              );
            })[0];
            if (top?.[0]) {
              state.historicoTopMedico[HISTORICO_COMPLETO_ID] = top[0];
            }
          }
          saveHistoricoTopMedicoCache();
          patchHistoricoChipAvatars();
        })();
        return historicoTopWarmPromise;
      }

      function renderHistoricoMonths() {
        if (!el.historicoMonths) return;
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonthIdx = now.getMonth();
        const years = historicoMesesPorAno();
        const periodo = historicoCompletoPeriodoLabel();
        const periodoHtml = periodo
          ? `<span class="historico-all-chip-period">${periodo}</span>`
          : "";
        const allAvatar = historicoChipAvatarHtml(
          state.historicoTopMedico[HISTORICO_COMPLETO_ID],
          "historico-all-chip-avatar historico-chip-avatar",
        );
        const allBtn = `<button type="button" class="historico-all-chip historico-month-btn" data-historico-id="${HISTORICO_COMPLETO_ID}" aria-pressed="false"><span class="historico-all-chip-copy">Histórico completo${periodoHtml}</span>${allAvatar}</button>`;
        const rows = years
          .map(([year, months]) => {
            const cells = months
              .map((entry, monthIdx) => {
                if (!entry) {
                  return `<div class="historico-month-slot" aria-hidden="true"></div>`;
                }
                const isCurrent =
                  year === currentYear && monthIdx === currentMonthIdx;
                const year2 = String(year).slice(-2);
                const avatar = historicoChipAvatarHtml(
                  state.historicoTopMedico[entry.id],
                  "historico-month-chip-avatar historico-chip-avatar",
                );
                return `<button type="button" class="historico-month-chip historico-month-btn${isCurrent ? " is-current" : ""}" data-historico-id="${entry.id}" aria-label="${entry.label}" aria-pressed="false" title="${entry.label}">
        <span class="historico-month-chip-text">
          <span class="historico-month-chip-name">${HISTORICO_MESES_LABEL[monthIdx]}</span>
          <span class="historico-month-chip-year">${year2}</span>
        </span>
        ${avatar}
      </button>`;
              })
              .join("");
            return `<div class="historico-year-row">${cells}</div>`;
          })
          .join("");
        el.historicoMonths.innerHTML = `${allBtn}<div class="historico-grid">${rows}</div>`;
        syncHistoricoActiveButtons();
      }

      function toggleHistoricoBar(forceOpen) {
        const open =
          typeof forceOpen === "boolean" ? forceOpen : !state.historicoOpen;
        state.historicoOpen = open;
        if (el.historicoBar) el.historicoBar.hidden = !open;
        if (open) {
          renderHistoricoMonths();
          setHistoricoStatus("");
          warmHistoricoTopMedicos();
        }
      }

      async function carregarHistoricoMes(monthId) {
        const entry = HISTORICO_MESES.find((m) => m.id === monthId);
        if (!entry) throw new Error("Mês histórico inválido.");
        setHistoricoStatus(`Carregando ${entry.label}…`);
        const { name, buffer } = await fetchHistoricoFile(entry);
        return processarArrayBuffer(buffer, name);
      }

      async function carregarHistoricoCompleto() {
        const payloads = [];
        for (let i = 0; i < HISTORICO_MESES.length; i++) {
          const entry = HISTORICO_MESES[i];
          setHistoricoStatus(
            `Carregando histórico completo (${i + 1}/${HISTORICO_MESES.length}): ${entry.label}…`,
          );
          const { name, buffer } = await fetchHistoricoFile(entry);
          payloads.push(await processarArrayBuffer(buffer, name));
        }
        return mergeHistoricoPayloads(payloads, "Histórico completo");
      }

      async function executarHistorico(historicoId) {
        if (state.historicoLoading) return;
        setHistoricoLoading(true);
        setHistoricoStatus("");
        try {
          const payload =
            historicoId === HISTORICO_COMPLETO_ID
              ? await carregarHistoricoCompleto()
              : await carregarHistoricoMes(historicoId);
          state.historicoActiveId = historicoId;
          syncHistoricoActiveButtons();
          showUploadGate(false);
          await bootstrapWithPayload(payload);
          rememberHistoricoTopFromPlantoes(historicoId, state.plantoes);
          const label =
            historicoId === HISTORICO_COMPLETO_ID
              ? "Histórico completo"
              : HISTORICO_MESES.find((m) => m.id === historicoId)?.label ||
                historicoId;
          const n = state.plantoes.length;
          const plantaoWord = n === 1 ? "plantão" : "plantões";
          setHistoricoStatus(`Exibindo ${label} · ${n} ${plantaoWord}.`);
        } catch (err) {
          setHistoricoStatus(err.message || String(err), true);
        } finally {
          setHistoricoLoading(false);
        }
      }

      function openHistoricoFromGate() {
        showUploadGate(false);
        el.changeSheetBtn.hidden = false;
        toggleHistoricoBar(true);
        setHistoricoStatus("Escolha um mês ou o histórico completo.");
      }

      function wireHistoricoUi() {
        loadHistoricoTopMedicoCache();
        renderHistoricoMonths();
        el.historicoBtn?.addEventListener("click", () => {
          if (el.uploadOverlay && !el.uploadOverlay.hidden) {
            openHistoricoFromGate();
            return;
          }
          toggleHistoricoBar();
        });
        el.historicoFromUploadBtn?.addEventListener("click", () => {
          openHistoricoFromGate();
        });
        el.historicoMonths?.addEventListener("click", (e) => {
          const btn = e.target.closest(".historico-month-btn");
          if (!btn || btn.disabled) return;
          const id = btn.dataset.historicoId;
          if (!id) return;
          executarHistorico(id);
        });
      }

      async function executarAnalise(file) {
        if (!file) {
          setUploadError("Escolha um arquivo .xls ou .xlsx.");
          return;
        }
        const ext = file.name.toLowerCase();
        if (!ext.endsWith(".xls") && !ext.endsWith(".xlsx")) {
          setUploadError("Formato não suportado. Use .xls ou .xlsx.");
          return;
        }
        setUploadError("");
        setUploadProcessing(true);
        try {
          state.lastFile = file;
          state.historicoActiveId = null;
          syncHistoricoActiveButtons();
          setHistoricoStatus("");
          const payload = await processarArquivo(file);
          showUploadGate(false);
          el.fileInput.value = "";
          await bootstrapWithPayload(payload);
        } catch (err) {
          setUploadError(err.message || String(err));
        } finally {
          setUploadProcessing(false);
        }
      }

      function wireUploadUi() {
        el.uploadForm.addEventListener("submit", (e) => e.preventDefault());

        el.uploadDrop.addEventListener("dragover", (e) => {
          e.preventDefault();
          el.uploadDrop.classList.add("dragover");
        });
        el.uploadDrop.addEventListener("dragleave", () =>
          el.uploadDrop.classList.remove("dragover"),
        );
        el.uploadDrop.addEventListener("drop", (e) => {
          e.preventDefault();
          el.uploadDrop.classList.remove("dragover");
          const f = e.dataTransfer.files[0];
          if (!f) return;
          const dt = new DataTransfer();
          dt.items.add(f);
          el.fileInput.files = dt.files;
          executarAnalise(f);
        });

        el.fileInput.addEventListener("change", () => {
          const file = el.fileInput.files[0];
          if (file) executarAnalise(file);
        });
      }

      function init() {
        wirePlantaoMainDelegatesOnce();
        wireUploadUi();
        wireHistoricoUi();
        el.changeSheetBtn.addEventListener("click", () => showUploadGate(true));
        el.uploadOverlay.addEventListener("click", (e) => {
          if (e.target !== el.uploadOverlay) return;
          if (!state.plantoes.length) return;
          showUploadGate(false);
        });
        showUploadGate(true);
        el.changeSheetBtn.hidden = true;
        el.app.classList.remove("loading");
        ensureFavicon();
      }

      init();
    </script>
  </body>
</html>
